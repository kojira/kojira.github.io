name: Refresh portfolio data

# generate.sh を定期実行して、
# - data.js（PROJECTSタイムライン＋サマリー集計）
# - history.js（HISTORYのクライアント用データ）
# - index.html（HISTORYのSEO向け静的HTML）
# を最新化する。
# 変更があったときだけコミット＆プッシュ → GitHub Pages が再ビルドされる。
on:
  schedule:
    - cron: "0 18 * * *"   # 毎日 18:00 UTC（= 03:00 JST）
  workflow_dispatch: {}      # 手動実行も可能（Actions タブから Run workflow）
  push:
    paths:
      - "history.jsonl"
      - "generate.sh"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate portfolio data and history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh CLI 用（公開リポジトリの読み取りに使用）
        run: |
          chmod +x generate.sh
          ./generate.sh

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- data.js history.js index.html; then
            echo "生成物に変更なし。スキップ。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js history.js index.html
          git commit -m "chore: refresh generated portfolio data"
          git push
          echo "生成物を更新してプッシュしました。"
